<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Solver</title>
</head>
<body>
    <h1>Wordle Solver</h1>
    
    <!-- Section A: Green Letters-->
    <section id="green-letters">
        <h2>Green Letters</h2>
        <div id="green-inputs">
            <input type="text" maxlength="1" class="green-input" data-position="0">
            <input type="text" maxlength="1" class="green-input" data-position="1">
            <input type="text" maxlength="1" class="green-input" data-position="2">
            <input type="text" maxlength="1" class="green-input" data-position="3">
            <input type="text" maxlength="1" class="green-input" data-position="4">
        </div>
    </section>

    <!-- Section B: Yellow Letters-->
     <section id="yellow-letters">
        <h1>Yellow Letters</h1>
        <div id="yellow-entries"></div>
        <button id="add-yellow-btn" type="button"> + Add Yellow Letter </button>
    </section>

    

    <!-- Section C: Gray Letters-->
     <section id="section-gray">
        <h2>Gray Letters</h2>
        <input type="text" id="gray-input" placeholder="e.g. Q,W,X,Z">
     </section>

    <!-- Result: -->
     <section id="section-gray">
        <h2>Gray Letters (Not in Word)</h2>
        <div id="results-list"></div>
     </section>

     <!-- Template for a yellow letter row (cloned via JS)-->
      <template id="yellow-row-template">
        <div class="yellow-row">
            <input typ="text" maxlength="1" class="yellow-letter-input" placeholder="Letter">
            <span class="yellow-position-checkboxes">
                <label><input type="checkbox" class="yellow-pos-checkbox" data-pos="0"> 1</label>
                <label><input type="checkbox" class="yellow-pos-checkbox" data-pos="1"> 2</label>
                <label><input type="checkbox" class="yellow-pos-checkbox" data-pos="2"> 3</label>
                <label><input type="checkbox" class="yellow-pos-checkbox" data-pos="3"> 4</label>
                <label><input type="checkbox" class="yellow-pos-checkbox" data-pos="4"> 5</label>
            </span>
            <button type="button" class="remove-yellow-btn">Remove</button>
            </div>
      </template>

      <script src="script.js"></script>
</body>
</html>
